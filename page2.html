<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Кількість квитків</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{background:#b4d4d1;color:#222}.app{width:390px;min-height:844px;margin:0 auto;padding:59px 17px 130px}.card{background:#fff;border-radius:17px;box-shadow:0 2px 6px rgba(0,0,0,.15);padding:17px;margin-bottom:9px}.transport{height:77px;display:flex;align-items:center;gap:12px;color:#777;font-size:15px;line-height:1.15}.transport-name{max-width:275px}.transport-logo{width:34px;height:34px;object-fit:contain;flex:none}.icon{font-size:30px;color:#244f9d}.product{min-height:160px}.top{display:flex;justify-content:space-between;align-items:flex-start}.service{display:flex;gap:13px}.check{width:22px;height:22px;border-radius:5px;background:#4cad24;color:white;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}.name{font-size:23px}.sub{font-size:20px;color:#777}.price{font-size:22px;white-space:nowrap}.title{text-align:center;font-size:21px;margin-top:25px}.counter{display:flex;justify-content:center;align-items:center;gap:31px;margin-top:11px}.circle{width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.13);font-size:30px;color:#4cad24;cursor:pointer;padding:0}.quantity{width:120px;height:43px;border-radius:9px;background:#e9e9e9;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600}.bottom{position:fixed;width:356px;left:50%;transform:translateX(-50%);bottom:23px;z-index:5}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:600;margin-bottom:17px}.pay{width:100%;height:47px;border:0;border-radius:10px;background:linear-gradient(100deg,#48c64d,#139fc0);color:#fff;font:400 24px inherit;cursor:pointer}@media(max-width:389px){.app{width:100%}.bottom{width:calc(100% - 34px)}}</style><link rel="manifest" href="manifest.json"></head><body><main class="app"><div class="card transport"><img class="transport-logo" src="images/iconPage2.PNG" alt="КП"><span class="transport-name" id="transportName"></span></div><div class="card product"><div class="top"><div class="service"><div class="check">✓</div><div><div class="name">Проїзд</div><div class="sub">Послуга</div></div></div><div class="price"><span id="topPrice">25</span>,00 UAH</div></div><div class="title">Кількість квитків</div><div class="counter"><button class="circle" onclick="changeQuantity(-1)">−</button><div class="quantity" id="quantity">1</div><button class="circle" onclick="changeQuantity(1)">+</button></div></div></main><div class="bottom"><div class="total"><span>До сплати</span><span><span id="bottomPrice">25</span>,00 UAH</span></div><button class="pay" onclick="goToPayment()">Сплатити</button></div><script>
const PRICE=25;const transportNumber=localStorage.getItem("transportNumber")||"";const isBus=transportNumber.length===4;document.getElementById("transportName").textContent=isBus?"КП Бабчинецька транспортна компанія автобуси":"КП Бабчинецька транспортна компанія";let quantity=Math.max(1,Number(localStorage.getItem("ticketQuantity"))||1);function render(){const t=quantity*PRICE;document.getElementById("quantity").textContent=quantity;document.getElementById("topPrice").textContent=t;document.getElementById("bottomPrice").textContent=t}function changeQuantity(d){quantity=Math.max(1,quantity+d);render()}function goToPayment(){localStorage.setItem("ticketQuantity",quantity);localStorage.setItem("ticketTotal",quantity*PRICE);window.location.href="payment.html"}render();
</script></body></html>
