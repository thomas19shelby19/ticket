<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bad4d2"><title>Кількість квитків</title>
<style>
@font-face{font-family:Comfortaa;src:url('./images/Comfortaa-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:Comfortaa;src:url('./images/Comfortaa-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:Comfortaa,Arial,sans-serif}
body{background:#bad4d2;color:#212121}
.app{position:relative;width:390px;height:777px;margin:0 auto;overflow:hidden;padding:59px 16px 0}
.card{position:relative;width:358px;background:#fff;border-radius:17px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.transport{height:72px;margin:0 0 8px}
.transport-logo{position:absolute;left:15px;top:15px;width:27px;height:26px;object-fit:contain}
.transport-name{position:absolute;left:65px;top:20px;width:250px;white-space:normal;color:#757575;font-size:12px;line-height:13px;font-weight:400}
.product{height:150px}
.check{position:absolute;left:16px;top:16px;width:20px;height:20px;border-radius:4px;background:#64a33b;color:#fff;font:700 15px/20px Arial,sans-serif;text-align:center}
.name{position:absolute;left:49px;top:17px;width:210px;font-size:13px;line-height:15px;color:#212121;white-space:nowrap}
.sub{position:absolute;left:49px;top:37px;font-size:12px;line-height:15px;color:#757575}
.price{position:absolute;right:18px;top:15px;font-size:14px;line-height:17px;color:#111;white-space:nowrap;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
.title{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:12px;line-height:15px;color:#212121}
.circle{position:absolute;top:94.333px;width:40px;height:40px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.13);color:#64a33b;font:400 30px/40px Comfortaa,Arial,sans-serif;padding:0;cursor:pointer}
.minus{left:35.333px}.plus{right:70.667px}
.quantity{position:absolute;left:123px;top:94px;width:112px;height:40px;border-radius:9px;background:#ebebeb;display:flex;align-items:center;justify-content:center;font:700 24px/40px -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;color:#000}
.bottom{position:absolute;left:16px;top:603px;width:358px;z-index:10}
.total{height:24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;font:700 18px/24px -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;color:#111}
.pay{width:358px;height:47px;border:0;border-radius:10px;background:linear-gradient(100deg,#65b668 0%,#4c9c9a 100%);color:#fff;font:400 20px/47px Comfortaa,Arial,sans-serif;padding:0;cursor:pointer}

</style><link rel="manifest" href="manifest.json"></head>
<body><main class="app">
<div class="card transport"><img class="transport-logo" src="images/iconPage2.PNG" alt="КП"><span class="transport-name" id="transportName"></span></div>
<div class="card product"><div class="check">✓</div><div class="name" id="serviceName">Проїзд</div><div class="sub">Послуга</div><div class="price"><span id="topPrice">25</span>,00 UAH</div><div class="title">Кількість квитків</div>
<button class="circle minus" onclick="changeQuantity(-1)" aria-label="Зменшити">−</button><div class="quantity" id="quantity">1</div><button class="circle plus" onclick="changeQuantity(1)" aria-label="Збільшити">+</button></div>
</main><div class="bottom"><div class="total"><span>До сплати</span><span><span id="bottomPrice">25</span>,00 UAH</span></div><button class="pay" onclick="goToPayment()">Сплатити</button></div>
<script>
const PRICE=25;const n=localStorage.getItem('transportNumber')||'';const bus=n.length===4;
document.getElementById('transportName').textContent=bus?'КП Вінницька транспортна компанія автобуси':'КП Вінницька транспортна компанія';
document.getElementById('serviceName').textContent=bus?'Проїзд(Автобус)':'Проїзд';
let quantity=Math.max(1,Number(localStorage.getItem('ticketQuantity'))||1);
function render(){const total=quantity*PRICE;document.getElementById('quantity').textContent=quantity;document.getElementById('topPrice').textContent=total;document.getElementById('bottomPrice').textContent=total}
function changeQuantity(d){quantity=Math.max(1,quantity+d);render()}
function goToPayment(){localStorage.setItem('ticketQuantity',quantity);localStorage.setItem('ticketTotal',quantity*PRICE);window.location.href='payment.html'}
render();
</script></body></html>
