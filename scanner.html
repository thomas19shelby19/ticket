<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<title>Сканування QR</title>
<style>
@font-face{font-family:Comfortaa;src:url('./images/Comfortaa-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:Comfortaa;src:url('./images/Comfortaa-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Comfortaa,Arial,sans-serif}
.app{position:fixed;inset:0;background:#000;overflow:hidden}
#camera{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:#000}
.safari{position:absolute;left:50%;top:75%;transform:translate(-50%,-50%);z-index:5;width:129px;height:14.5px;padding:0;border:0;border-radius:3px;background:#F4C400;color:#111;font:700 7.25px/14.5px Comfortaa,Arial,sans-serif;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.22);cursor:pointer}
</style>
</head>
<body>
<main class="app">
  <video id="camera" autoplay playsinline muted></video>
  <button class="safari" type="button" onclick="goNext()">Перейти у Safari</button>
</main>
<script>
let stream=null;
async function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const video=document.getElementById('camera');
    video.srcObject=stream;
    await video.play().catch(()=>{});
  }catch(e){}
}
function stopCamera(){
  if(stream){stream.getTracks().forEach(track=>track.stop());stream=null;}
}
function goNext(){stopCamera();window.location.href='page2.html';}
window.addEventListener('load',startCamera,{once:true});
window.addEventListener('pagehide',stopCamera);
</script>
</body>
</html>
