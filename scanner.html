<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4C400">
<link rel="manifest" href="./manifest.json">
<title>Сканування QR</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Comfortaa,Arial,sans-serif}
.app{position:fixed;inset:0;background:#000;overflow:hidden}
#reader{position:absolute;inset:0;width:100%;height:100%;background:#000;overflow:hidden}
#reader video{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important}
#reader__scan_region{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}
#reader__scan_region img,#reader__dashboard,#reader__dashboard_section_csr,#reader__dashboard_section_swaplink,#reader__status_span{display:none!important}
.safari{position:absolute;left:18px;right:18px;top:75%;transform:translateY(-50%);z-index:5;height:38px;padding:0 14px;border:0;border-radius:8px;background:#F4C400;color:#111;font:700 14px/38px Comfortaa,Arial,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.22)}
</style>
</head>
<body>
<main class="app"><div id="reader"></div><button class="safari" type="button" onclick="goNext()">Відкрити у Safari</button></main>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<script>
let scanner=null,started=false;
function goNext(){ if(scanner){scanner.stop().catch(()=>{});scanner=null} window.location.href='page2.html'; }
async function startCamera(){
  if(started)return;
  if(typeof Html5Qrcode==='undefined'){setTimeout(startCamera,250);return;}
  started=true;
  scanner=new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:250,height:250}},decoded=>{
      localStorage.setItem('scannedQr',decoded);
      goNext();
    },()=>{});
  }catch(e){
    try{
      await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},decoded=>{
        localStorage.setItem('scannedQr',decoded);goNext();
      },()=>{});
    }catch(e2){}
  }
}
window.addEventListener('load',startCamera);
</script>
</body>
</html>
