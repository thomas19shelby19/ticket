<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="./manifest.json">
<title>Сканування QR</title>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
.app{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  min-height:100vh;
  background:#000;
  overflow:hidden
}
#reader{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden
}
#reader video{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  max-width:none!important;
  max-height:none!important;
  object-fit:cover!important
}
#reader__scan_region{
  width:100%!important;
  height:100%!important;
  min-height:0!important;
  position:absolute!important;
  inset:0!important
}
#reader__scan_region img,
#reader__dashboard_section_csr img{
  display:none!important
}
#reader__dashboard{
  position:absolute!important;
  left:0!important;
  right:0!important;
  bottom:calc(86px + env(safe-area-inset-bottom))!important;
  z-index:3!important;
  color:#fff!important;
  text-align:center!important
}
#reader__dashboard_section_csr{
  background:transparent!important;
  padding:0!important
}
#reader__dashboard_section_swaplink{
  display:none!important
}
#reader__status_span{
  color:rgba(255,255,255,.72)!important;
  font-size:13px!important
}
#reader__dashboard_section_csr button{
  border:1px solid rgba(255,255,255,.25)!important;
  border-radius:10px!important;
  padding:8px 12px!important;
  background:rgba(0,0,0,.32)!important;
  color:rgba(255,255,255,.8)!important
}
.overlay{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:
    calc(18px + env(safe-area-inset-top))
    17px
    calc(18px + env(safe-area-inset-bottom))
}
.title{
  align-self:center;
  margin-top:8px;
  font-size:22px;
  font-weight:500;
  text-shadow:0 2px 8px rgba(0,0,0,.55)
}
.note{
  align-self:center;
  margin-bottom:76px;
  color:rgba(255,255,255,.72);
  font-size:14px;
  text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,.65)
}
.safari{
  position:absolute;
  left:17px;
  right:17px;
  bottom:calc(68px + env(safe-area-inset-bottom));
  z-index:5;
  height:47px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:10px;
  background:rgba(255,255,255,.10);
  color:rgba(255,255,255,.84);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font:400 18px inherit
}
</style>
</head>
<body>
<main class="app">
  <div id="reader"></div>
  <div class="overlay">
    <div class="title">Сканування QR-коду</div>
    <div class="note" id="note">Наведіть камеру на QR-код</div>
  </div>
  <button class="safari" onclick="goNext()">Відкрити у Safari</button>
</main>

<script>
function goNext(){
  window.location.href="page2.html";
}

window.addEventListener("load",()=>{
  const start=()=>{
    if(typeof Html5Qrcode==="undefined"){
      setTimeout(start,250);
      return;
    }
    const scanner=new Html5Qrcode("reader");
    scanner.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:250,height:250}},
      decoded=>{
        scanner.stop().catch(()=>{});
        localStorage.setItem("scannedQr",decoded);
        goNext();
      },
      ()=>{}
    ).catch(()=>{
      document.getElementById("note").textContent=
        "Не вдалося відкрити камеру. Натисніть «Відкрити у Safari».";
    });
  };
  start();
});
</script>
</body>
</html>
