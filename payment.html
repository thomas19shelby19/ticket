<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Оплата проїзду</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{background:#f1f3f5;color:#222}.app{width:390px;min-height:844px;margin:0 auto;padding:50px 17px 30px}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:18px}.logo{font-size:23px;font-weight:600;color:#444;letter-spacing:-1px;margin-bottom:19px}.logo span{color:#4fc54c}.title{font-size:17px;margin-bottom:24px}.dash{border-top:2px dashed #d4d4d4;margin-bottom:21px}.total{display:flex;justify-content:space-between;align-items:center}.label{font-size:17px}.price{font-size:22px}.pay{width:100%;height:51px;border:0;border-radius:9px;background:#000;color:#fff;font:400 21px inherit;margin-bottom:17px}.pay-image{display:flex;align-items:center;justify-content:center;padding:0}.pay-image img{max-width:58%;max-height:72%;object-fit:contain}.apple{margin-bottom:22px}.or{display:flex;align-items:center;gap:16px;margin-bottom:22px}.line{height:1px;background:#c7c7c7;flex:1}.or span{font-size:17px}.form{background:#fff;border-radius:18px;padding:21px 17px}.field{display:block;font-size:17px;margin:0 10px 10px}input{width:100%;height:51px;border:0;border-radius:9px;background:#eee;padding:0 12px;font:16px inherit;outline:0;margin-bottom:24px}.card-number{border:1px solid #2774ff;box-shadow:0 0 0 4px rgba(39,116,255,.10)}.two{display:flex;gap:17px}.half{width:50%}@media(max-width:389px){.app{width:100%}}</style><link rel="manifest" href="manifest.json"></head><body><main class="app"><section class="card"><div class="logo">LIQPAY <span>»</span></div><div class="title">Оплата проїзду</div><div class="dash"></div><div class="total"><span class="label">До оплати</span><span class="price" id="totalPrice">25.00 UAH</span></div></section><button class="pay pay-image" onclick="goToNextPage()"><img src="./images/GooglePay.PNG" alt="Google Pay"></button><button class="pay apple pay-image" onclick="goToNextPage()"><img src="./images/applePay.PNG" alt="Apple Pay"></button><div class="or"><div class="line"></div><span>або</span><div class="line"></div></div><section class="form"><label class="field">Номер картки</label><input class="card-number" type="text" inputmode="numeric"><div class="two"><div class="half"><label class="field">Термін дії</label><input type="text" placeholder="MM / PP" maxlength="5"></div><div class="half"><label class="field">CVV2 / CVC2</label><input type="password" placeholder="123" maxlength="3"></div></div><label class="field">Email для отримання квитанції</label><input type="email" placeholder="example@domain.com"></section></main><script>const total=Number(localStorage.getItem("ticketTotal"))||25;document.getElementById("totalPrice").textContent=total.toFixed(2)+" UAH";function goToNextPage(){const now=Date.now();localStorage.setItem("paymentTime",now);localStorage.setItem("expirationTime",now+3600000);window.location.href="page4.html"}</script></body></html>
