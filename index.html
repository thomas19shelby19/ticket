<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>Number_ticket</title>
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#1c1c1e;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{width:390px;height:844px;margin:0 auto;padding:114px 17px 30px}
.card{width:356px;height:77px;background:#2c2c2e;border:1px solid #3a3a3c;border-radius:17px;box-shadow:0 2px 8px rgba(0,0,0,.4);padding:0 17px;margin:0 0 12px;display:flex;align-items:center}

/* Стилі для поля вводу в темній темі */
input{
  display:block;
  width:100%;
  height:77px;
  border:0;
  outline:0;
  background:transparent;
  padding:0 5px;
  font-size:18px;
  font-weight:500;
  color:#ffffff;
  -webkit-appearance:none;
  appearance:none;
  border-radius:0;
}
input::placeholder{color:#8e8e93;opacity:1;font-size:14px}

/* Стилі для кнопки в темній темі */
.next{
  display:block;
  width:356px;
  height:56px;
  border:0;
  border-radius:10px;
  background:#3a3a3c;
  color:#ffffff;
  font-size:13px;
  font-weight:500;
  line-height:56px;
  text-align:center;
  cursor:pointer;
  padding:0;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
}
.next:active{background:#48484a}

.error{color:#ff453a;font-size:13px;margin:-3px 4px 12px;display:none}
@media(max-width:389px){.app{width:100%;padding-left:17px;padding-right:17px}.card,.next{width:100%}}
</style>
</head>
<body>
<main class="app">
  <div class="card"><input id="transportNumber" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Номер" maxlength="4" autocomplete="off" aria-label="Номер транспорту"></div>
  <div id="error" class="error"></div>
  <button class="next" type="button" onclick="openScanner()">Далі</button>
</main>
<script>
const input=document.getElementById("transportNumber");
const error=document.getElementById("error");
input.addEventListener("input",()=>{
  input.value=input.value.replace(/\D/g,"").slice(0,4);
  error.style.display="none";
});
function openScanner(){
  const n=input.value.trim();
  if(n.length===0){
    const previous=localStorage.getItem("transportNumber");
    if(previous){
      window.location.href="page4.html";
      return;
    }
    error.textContent="Немає збереженого квитка";
    error.style.display="block";
    return;
  }
  if(n.length!==3&&n.length!==4){
    error.textContent="Введіть номер транспорту з 3 або 4 цифр";
    error.style.display="block";
    return;
  }
  localStorage.setItem("transportNumber",n);
  localStorage.setItem("transportType",n.length===4?"bus":"trolleybus");
  window.location.href="scanner.html";
}
</script>
</body>
</html>
