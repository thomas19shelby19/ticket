<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Number_ticket</title>
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;-webkit-text-size-adjust:none;text-size-adjust:none}
body{background:#ffffff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{width:100%;max-width:390px;margin:0 auto;padding:114px 17px 30px}
.card{width:100%;height:80px;background:#fff;border:1px solid #e0e0e0;border-radius:17px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:0 17px;margin:0 0 14px;display:flex;align-items:center}

/* Фіксуємо масштаб тексту незалежно від налаштувань системи та браузера */
input{
  display:block;
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  padding:0 5px;
  font-size:10vw !important; /* Динамічний фіксований розмір від ширини екрана */
  font-weight:700;
  color:#222;
  -webkit-appearance:none;
  appearance:none;
  border-radius:0;
  line-height:80px;
}

@media (min-width: 390px) {
  input { font-size: 38px !important; } /* Максимальний фіксований розмір для більших екранів */
  .next { font-size: 26px !important; }
}

input::placeholder{color:#c9c9c9;opacity:1;font-size:0.8em;font-weight:400}

.next{
  display:block;
  width:100%;
  height:60px;
  border:0;
  border-radius:12px;
  background:#8e8e93;
  color:#fff;
  font-size:6.8vw !important;
  font-weight:700;
  line-height:60px;
  text-align:center;
  cursor:pointer;
  padding:0;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
}

.error{color:#c62828;font-size:16px;margin:-3px 4px 12px;display:none;font-weight:500}
</style>
</head>
<body>
<main class="app">
  <div class="card"><input id="transportNumber" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Номер" maxlength="4" autocomplete="off" aria-label="Номер транспорту"></div>
  <div id="error" class="error"></div>
  <button class="next" type="button" onclick="openScanner()">Далі</button>
</main>
<script>
const input=document.getElementById("transportNumber");
const error=document.getElementById("error");
input.addEventListener("input",()=>{
  input.value=input.value.replace(/\D/g,"").slice(0,4);
  error.style.display="none";
});
function openScanner(){
  const n=input.value.trim();
  if(n.length===0){
    const previous=localStorage.getItem("transportNumber");
    if(previous){
      window.location.href="page4.html";
      return;
    }
    error.textContent="Немає збереженого квитка";
    error.style.display="block";
    return;
  }
  if(n.length!==3&&n.length!==4){
    error.textContent="Введіть номер транспорту з 3 або 4 цифр";
    error.style.display="block";
    return;
  }
  localStorage.setItem("transportNumber",n);
  localStorage.setItem("transportType",n.length===4?"bus":"trolleybus");
  window.location.href="scanner.html";
}
</script>
</body>
</html>
