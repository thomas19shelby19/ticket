<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b4d5d2">
<title>Квиток</title>
<style>
@font-face{font-family:Comfortaa;src:url('./images/Comfortaa-Regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:Comfortaa;src:url('./images/Comfortaa-Bold.ttf') format('truetype');font-weight:700;font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:390px;height:777px;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:Comfortaa,Arial,sans-serif}
body{background:#b4d5d2;color:#212121}
.page{position:relative;width:390px;height:777px;margin:0;padding-top:59px;overflow:hidden}
.ticket-wrap{position:relative;width:358px;height:514px;margin-left:16px;overflow:hidden}
.ticket-bg{position:absolute;left:0;top:0;width:358px;height:514px;display:block}

/* All ticket geometry is fixed to the supplied 390×777 reference. */
.mask{position:absolute;background:#fff;z-index:3;pointer-events:none}
.mask-number{left:288px;top:96px;width:54px;height:23px}
.mask-date{left:12px;top:365px;width:118px;height:22px}
.mask-qty{left:286px;top:365px;width:56px;height:22px}
.mask-timer{left:146px;top:431px;width:67px;height:31px}
.mask-company{left:38px;top:14px;width:270px;height:52px;display:none}
.mask-ride{left:98px;top:438px;width:162px;height:40px;display:none}

/* Dynamic values use the same system face visible in the reference ticket. */
.dynamic{position:absolute;z-index:4;background:transparent;color:#212121;white-space:nowrap;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
.number{left:292px;top:97px;width:50px;font-size:21px;line-height:25px;font-weight:700;text-align:right}
.date{left:16px;top:366px;font-size:16px;line-height:20px;font-weight:600}
.qty{left:292px;top:366px;width:50px;font-size:16px;line-height:20px;font-weight:600;text-align:right}
.timer{left:149px;top:432px;width:60px;font-size:22px;line-height:27px;font-weight:700;color:#64a33b;text-align:center}
.company-bus{left:41px;top:38px;width:250px;height:34px;white-space:normal;font-family:Comfortaa,Arial,sans-serif;font-size:13px;line-height:17px;font-weight:400;color:#757575;text-align:left;display:none}

.bus-ride-pill{position:absolute;left:101px;top:473px;width:156px;height:24px;border-radius:6px;background:#dfecd5;z-index:5;display:none;align-items:center;justify-content:center;gap:3px;font-family:Comfortaa,Arial,sans-serif;font-size:10.5px;line-height:24px;font-weight:400;white-space:nowrap}
.bus-ride-pill .label{color:#6c726d}.bus-ride-pill .value{color:#64a33b}

/* The entire central illustration / QR area is one large touch target. */
.hit-info,.hit-qr{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;z-index:8;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.hit-info{left:307px;top:17px;width:34px;height:34px}
.hit-qr{left:72px;top:150px;width:214px;height:170px}

.history{position:absolute;left:16px;top:582px;width:358px;text-align:center;color:#8a9094;font-size:12px;line-height:17px;font-weight:400}

/* Additional-data sheet: exact supplied raster and exact reference position. */
.modal-layer{position:fixed;left:0;top:0;width:390px;height:777px;z-index:100;display:none;background:rgba(0,0,0,.62)}
.modal-layer.open{display:block}
.modal-sheet{position:absolute;left:0;top:82px;width:390px;height:658px;background:#b4d5d2 url('./images/modal_sheet_clean.png') center top/390px 658px no-repeat;border-radius:28px 28px 0 0;overflow:hidden}
.modal-close{position:absolute;left:9px;top:18px;width:55px;height:55px;border:0;background:transparent;padding:0;cursor:pointer;z-index:4}
</style>
<link rel="manifest" href="manifest.json">
</head>
<body>
<main class="page">
  <section class="ticket-wrap" id="ticketWrap">
    <img id="ticketBg" class="ticket-bg" src="images/ticket_closed.png" alt="Квиток">

    <div class="mask mask-number"></div>
    <div class="mask mask-date"></div>
    <div class="mask mask-qty"></div>
    <div class="mask mask-timer"></div>
    <div class="mask mask-company" id="companyMask"></div>
    <div class="mask mask-ride" id="rideMask"></div>

    <button class="hit-info" onclick="openModal()" aria-label="Додаткові дані"></button>
    <button class="hit-qr" id="qrHit" onclick="toggleQR()" aria-label="Переглянути QR"></button>

    <div class="dynamic number" id="numberOverlay"></div>
    <div class="dynamic date" id="dateOverlay"></div>
    <div class="dynamic qty" id="qtyOverlay"></div>
    <div class="dynamic timer" id="timerOverlay"></div>
    <div class="dynamic company-bus" id="companyBusOverlay"></div>

    <div class="bus-ride-pill" id="busRidePill"><span class="label">Квиток</span><span class="value">Проїзд(Автобус)</span></div>
  </section>
  <div class="history">Ви зможете заново відкрити цю сторінку<br>через історію браузера</div>
</main>

<div class="modal-layer" id="modalLayer" onclick="backdropClose(event)">
  <div class="modal-sheet">
    <button class="modal-close" onclick="closeModal()" aria-label="Закрити"></button>
  </div>
</div>

<script>
const n=localStorage.getItem('transportNumber')||'006';
const q=Math.max(1,Number(localStorage.getItem('ticketQuantity'))||1);
const bus=n.length===4;

document.getElementById('numberOverlay').textContent=n;
document.getElementById('qtyOverlay').textContent=q;

document.getElementById('companyMask').style.display=bus?'block':'none';
document.getElementById('companyBusOverlay').style.display=bus?'block':'none';
document.getElementById('busRidePill').style.display=bus?'flex':'none';
document.getElementById('rideMask').style.display=bus?'block':'none';

let paymentTime=Number(localStorage.getItem('paymentTime'));
let expirationTime=Number(localStorage.getItem('expirationTime'));
if(!paymentTime){paymentTime=Date.now();localStorage.setItem('paymentTime',String(paymentTime))}
if(!expirationTime){expirationTime=paymentTime+3600000;localStorage.setItem('expirationTime',String(expirationTime))}

const months=['січ.','лют.','бер.','квіт.','трав.','черв.','лип.','серп.','вер.','жовт.','лист.','груд.'];
function formatDate(ts){
  const d=new Date(ts);
  return String(d.getDate()).padStart(2,'0')+' '+months[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
document.getElementById('dateOverlay').textContent=formatDate(paymentTime);

function tick(){
  const left=Math.max(0,expirationTime-Date.now());
  const s=Math.floor(left/1000);
  const mm=Math.floor(s/60), ss=s%60;
  document.getElementById('timerOverlay').textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  if(left<=0)clearInterval(timerId);
}
const timerId=setInterval(tick,250); tick();

let qrOpen=false;
function toggleQR(){
  qrOpen=!qrOpen;
  document.getElementById('ticketBg').src=qrOpen?'images/ticket_open.png':'images/ticket_closed.png';
  document.getElementById('qrHit').setAttribute('aria-label',qrOpen?'Закрити QR':'Переглянути QR');
}
function openModal(){document.getElementById('modalLayer').classList.add('open')}
function closeModal(){document.getElementById('modalLayer').classList.remove('open')}
function backdropClose(e){if(e.target===document.getElementById('modalLayer'))closeModal()}
</script>
</body>
</html>
