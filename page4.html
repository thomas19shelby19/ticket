<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квиток</title>
<style>
@font-face{font-family:PryvatSans;src:url('./fonts/PryvatSans-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:PryvatSans;src:url('./fonts/PryvatSans-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
*{font-feature-settings:"ss01" on;font-variant-numeric:lining-nums tabular-nums;font-family:PryvatSans,Arial,Helvetica,sans-serif;box-sizing:border-box}
html,body{height:100dvh;font-size:12px;scroll-behavior:smooth;background:rgba(172,214,211,1)}
body{margin:0;padding-top:1rem;padding-inline:1.3333333333rem;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.app-tickets{display:flex;gap:.6666666667rem;align-items:center;flex-direction:column}
.tip-text{text-align:center;max-width:19.6666666667rem;color:rgba(138,144,148,1);margin:0}
app-ticket{width:100%;display:flex;position:relative;flex-direction:column;box-shadow:0 0 2px 0 rgba(0,0,0,.1),0 2px 4px 0 rgba(0,0,0,.1),0 0 2px 0 rgba(0,0,0,.1);border-radius:.6666666667rem;background:#fff}
.header-content-wrapper{display:flex;flex-direction:column;width:100%;gap:.6666666667rem}
.ticket-divider{display:flex;height:2.0833333333rem;position:relative;align-items:center;justify-content:center}
.ticket-divider:before,.ticket-divider:after{top:50%;content:"";position:absolute;width:1.6666666667rem;height:1.6666666667rem;border-radius:50%;transform:translateY(-50%);background:rgba(172,214,211,1)}
.ticket-divider:before{left:-.8333333333rem}.ticket-divider:after{right:-.8333333333rem}
.ticket-series,.ticket-vehicle{color:#757575;font-weight:400;font-size:1.1666666667rem;line-height:1.5rem;display:flex;align-items:center;justify-content:space-between;margin:0}
.ticket-series span,.ticket-vehicle span{font-weight:500}
.ticket-vehicle span{color:#212121;font-size:1.6666666667rem;line-height:1.3333333333rem;letter-spacing:-.0333333333rem}
.ticket-main{height:100%;display:flex;align-items:center;flex-direction:column;gap:1.3333333333rem;padding:0 1.3333333333rem 1.3333333333rem}
.ticket-main-info{width:100%;display:flex;align-items:center;justify-content:space-between}
.ticket-main-info-col{display:flex;gap:.3333333333rem;align-items:center;flex-direction:column;font-weight:400;font-size:1.1666666667rem;line-height:1.8333333333rem;letter-spacing:-.4px;margin:0}
.ticket-main-info-col__date-col{align-items:start}
.ticket-main-info-col-title{color:rgba(0,0,0,.54)}
.ticket-main-info-col-description{font-weight:500;line-height:2rem;color:#212121}
.placeholder-container{opacity:1;transform:translateY(0);display:flex;flex-direction:column;align-items:center;gap:1.3333333333rem}
.ticket-main-qr-placeholder{width:6.5rem;height:7.3333333333rem;aspect-ratio:1;background:url('./images/imgLogo.PNG') no-repeat center/contain}
.button-outline{background:transparent;border:1px solid #4EA524;color:#4EA524;border-radius:.3333333333rem;padding:.5rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.3333333333rem}
.button-outline svg{width:25px;height:24px;flex:none}
.ticket-main-expiration{display:flex;gap:.3333333333rem;text-wrap:pretty;text-align:center;flex-direction:column}
.ticket-main-expiration-type{font-size:1.3333333333rem;line-height:2rem;margin:0}
.ticket-main-expiration-time{font-weight:500;font-size:1.6666666667rem;line-height:2.3333333333rem;color:#4EA524;margin:0}
.ticket-service-type{border-radius:.3333333333rem;padding-inline:.6666666667rem;display:flex;gap:.3333333333rem;align-items:center;font:1.1666666667rem/1.8333333333rem PryvatSans,Arial,Helvetica,sans-serif;letter-spacing:-.4px;color:rgba(0,0,0,.54);margin:0}
.ticket-service-type__type{font-weight:500;line-height:2rem;word-break:break-word;text-wrap:pretty;color:#4EA524}
.ticket-green{background:rgba(78,165,36,.2)}
.header{display:flex;align-items:center;padding:1.3333333333rem;position:relative;border-radius:.6666666667rem;background:#fff;width:100%}
.header-company-wrapper{display:flex;gap:1.3333333333rem;flex-direction:column;width:100%}
.header-company-wrapper .row{display:flex}
.header-company-wrapper .row .col{display:flex;justify-content:space-between}
.header-company-wrapper .row .col:first-of-type{width:3.3333333333rem;min-width:3.3333333333rem;margin-right:8px}
.header-company-wrapper .row .col:last-of-type{width:100%;align-items:center}
.header-info-icon,.header .icon{height:3.3333333333rem;width:3.3333333333rem}
.header-info-icon{background:#fff url('./images/button_i.PNG') no-repeat center/contain;border:none;cursor:pointer;padding:0}
.header .icon{border-radius:.6666666667rem;object-fit:contain}
.header .company{display:inline-block;min-width:161px;text-align:left;text-wrap:pretty;font-weight:400;font-size:1.1666666667rem;line-height:1.3333333333rem;color:rgba(0,0,0,.54)}
.header-info-icon{font-size:0}
</style>
</head>
<body>
<app-tickets class="app-tickets">
  <app-ticket id="ticket">
    <app-header>
      <header class="header">
        <div class="header-company-wrapper">
          <div class="row">
            <div class="col"><img class="icon" src="./images/imgKP.PNG" alt="Company Logo"></div>
            <div class="col"><span class="company" id="companyName">КП Бабчинецька транспортна компанія</span><button class="header-info-icon" aria-label="Додаткова інформація"></button></div>
          </div>
          <div class="row">
            <div class="col"></div>
            <div class="col"><div class="header-content-wrapper">
              <p class="ticket-series">Серія <span>PB №827607809</span></p>
              <p class="ticket-vehicle">Бортовий номер <span id="transportNumber">001</span></p>
            </div></div>
          </div>
        </div>
      </header>
    </app-header>
    <section class="ticket-divider"><svg xmlns="http://www.w3.org/2000/svg" width="85%" height="2" viewBox="0 0 249 2" fill="none" preserveAspectRatio="none"><path opacity="0.21" d="M1 1H248" stroke="#8A9094" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"></path></svg></section>
    <main class="ticket-main">
      <div class="placeholder-container">
        <div class="ticket-main-qr-placeholder"></div>
        <button class="button-outline" id="qrButton">Переглянути QR <svg xmlns="http://www.w3.org/2000/svg" width="25" height="24" viewBox="0 0 25 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M9.76531 6.30461C10.1558 5.91409 10.789 5.91409 11.1795 6.30462L16.168 11.2931C16.5585 11.6837 16.5585 12.3168 16.168 12.7074L11.1795 17.6958C10.789 18.0863 10.1558 18.0863 9.76531 17.6958C9.37478 17.3053 9.37478 16.6721 9.76531 16.2816L14.0467 12.0002L9.7653 7.71882C9.37478 7.32829 9.37478 6.69513 9.76531 6.30461Z" fill="currentColor"></path></svg></button>
      </div>
      <div class="ticket-main-info">
        <p class="ticket-main-info-col ticket-main-info-col__date-col"><span class="ticket-main-info-col-title">Дата</span><span class="ticket-main-info-col-description" id="paymentDate">28 серп. 20:36</span></p>
        <p class="ticket-main-info-col"><span class="ticket-main-info-col-title">Сума</span><span class="ticket-main-info-col-description" id="amount">25</span></p>
        <p class="ticket-main-info-col"><span class="ticket-main-info-col-title">Квитків</span><span class="ticket-main-info-col-description" id="quantity">2</span></p>
      </div>
      <div class="ticket-main-expiration"><p class="ticket-main-expiration-type">Квиток разового використання</p><p class="ticket-main-expiration-time" id="timer">59:59</p></div>
      <p class="ticket-service-type ticket-green"><span class="ticket-service-type__service">Квиток</span><span class="ticket-service-type__type" id="rideName">Проїзд</span></p>
    </main>
  </app-ticket>
  <p class="tip-text">Ви зможете заново відкрити цю сторінку через історію браузера</p>
</app-tickets>
<script>
/* Логіка проєкту «Квиток». Дизайн, CSS, розміри та розташування сторінки 4 не змінюються. */
const PRICE = 25;
const n = localStorage.getItem('transportNumber') || '001';
const q = Math.max(1, Number(localStorage.getItem('ticketQuantity')) || 1);
const a = Number(localStorage.getItem('ticketTotal')) || q * PRICE;
const bus = n.length === 4;
const transportName = bus
  ? 'КП Бабчинецька транспортна компанія автобуси'
  : 'КП Бабчинецька транспортна компанія';

// Дані останньої оплати — сторінка 4 тільки відображає їх і не створює новий квиток.
const paymentTime = Number(localStorage.getItem('paymentTime')) || 0;
const expirationTime = Number(localStorage.getItem('expirationTime')) || 0;

document.getElementById('transportNumber').textContent = n;
document.getElementById('companyName').textContent = transportName;
document.getElementById('amount').textContent = a;
document.getElementById('quantity').textContent = q;
document.getElementById('rideName').textContent = bus ? 'Проїзд(Автобус)' : 'Проїзд';

function formatPaymentDate(timestamp) {
  const d = new Date(timestamp);
  const months = ['січ.','лют.','бер.','квіт.','трав.','черв.','лип.','серп.','вер.','жовт.','лист.','груд.'];
  return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

if (paymentTime) {
  document.getElementById('paymentDate').textContent = formatPaymentDate(paymentTime);
}

function updateTimer() {
  const timer = document.getElementById('timer');
  const remaining = expirationTime ? Math.max(0, expirationTime - Date.now()) : 0;
  const totalSeconds = Math.floor(remaining / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  timer.textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
  if (remaining <= 0) {
    timer.style.color = '#d93025';
    clearInterval(timerId);
  }
}

let timerId = setInterval(updateTimer, 1000);
updateTimer();

// Кнопка «Переглянути QR»: використовує вже наявний локальний QR-файл,
// не змінюючи жодних стилів сторінки.
const qrButton = document.getElementById('qrButton');
const qrPlaceholder = document.querySelector('.ticket-main-qr-placeholder');
if (qrButton && qrPlaceholder) {
  let qrOpened = false;
  qrButton.addEventListener('click', () => {
    qrOpened = !qrOpened;
    qrPlaceholder.style.backgroundImage = qrOpened
      ? "url('./images/qr_code.png')"
      : "url('./images/imgLogo.PNG')";
  });
}
</script>
</body>
</html>
